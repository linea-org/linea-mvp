services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: linea
      POSTGRES_USER: linea
      POSTGRES_PASSWORD: linea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linea"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs drizzle-kit migrations against postgres on every `docker compose up`.
  # On a fresh database (after `infra:reset`) it applies 0000 + 0001.
  # On an existing database it only applies new migrations.
  # restart: "no" ensures it exits after running (one-shot job).
  migrate:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: linea
      PGHOST: postgres
      PGUSER: linea
      PGDATABASE: linea
    volumes:
      - ./scripts/run-migrations.sh:/run-migrations.sh
      - ./packages/db/migrations:/migrations
    command: ["sh", "/run-migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
